name: Sync QA API contract after permissions changes
on:
  push:
    branches: [fix/role-application-review-actions-20261123]
    paths: ['.github/workflows/qa-permissions-openapi.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Prepare disposable contract DB
        run: |
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate --force
      - name: Generate OpenAPI from current routes
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          DB_URL: ''
          APP_URL: http://localhost:8000
        run: composer openapi
      - name: Commit contract and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git rm .github/workflows/qa-permissions-openapi.yml
          git commit -m "Synchronize API schema with reviewed Admin permissions"
          git push origin HEAD:fix/role-application-review-actions-20261123
