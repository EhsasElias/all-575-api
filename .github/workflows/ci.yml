name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Dependency audit
        run: composer audit
      - name: Code style
        run: composer lint
      - name: Generate OpenAPI contract for PR (diagnostic, temporary)
        run: |
          composer openapi
          echo 'OPENAPI_EXPORT_BEGIN'
          base64 -w0 docs/api/openapi.json | fold -w 480 | sed 's/^/OPENAPI_CHUNK:/'
          echo 'OPENAPI_EXPORT_END'
      - name: Tests (includes the check that docs/api/openapi.json matches the code)
        run: php artisan test
