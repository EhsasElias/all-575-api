name: Independent API regression

on:
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # The main CI stops at Pint; QA must still execute all behavioral assertions.
      - name: Laravel API feature and unit tests
        run: php artisan test
      # Export the current generated contract for review; do not quietly update the checked-in source.
      - name: Export current OpenAPI contract
        if: always()
        run: composer openapi
      - name: Upload generated contract for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-generated-openapi
          path: docs/api/openapi.json
          retention-days: 7
