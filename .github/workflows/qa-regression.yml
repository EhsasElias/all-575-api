name: Independent API regression

on:
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Execute behavioral tests even when the separate code-style gate is failing.
      - name: Laravel API feature and unit tests
        run: php artisan test
